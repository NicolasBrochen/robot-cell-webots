#VRML_SIM R2025a utf8
# template language: javascript
# 4-axis SCARA (RRPR) with a two-finger parallel gripper.
# J1, J2: revolute about z (L1 = 0.40 m, L2 = 0.30 m), J3: prismatic -z (0..0.15 m), J4: tool yaw.
# Finger centre height above the robot base = 0.175 m - J3.
# Devices: joint1..joint4, finger_left, finger_right (+ *_sensor), emitter, receiver.
# Own procedural model, no vendor CAD.

PROTO Scara4Axis [
  field SFVec3f    translation      0 0 0
  field SFRotation rotation         0 0 1 0
  field SFString   name             "scara"
  field SFString   controller       "<none>"
  field MFString   controllerArgs   []
  field SFBool     supervisor       FALSE
  field MFFloat    initialPosition  [0 0 0 0]   # J1 J2 J3 J4
  field SFFloat    transparency     0           # visual only
  field SFBool     showJointFrames  FALSE       # X red, Y green, Z blue
  field SFInt32    emitterChannel   2
  field SFInt32    receiverChannel  1
]
{
  %<
    const q = fields.initialPosition.value.concat([0, 0, 0, 0]);
    const tr = fields.transparency.value;
    function app(c, rough, metal) {
      return `PBRAppearance { baseColor ${c} roughness ${rough} metalness ${metal} transparency ${tr} }`;
    }
    function frame(dz, L = 0.16, w = 0.007) {
      if (!fields.showJointFrames.value) return '';
      const bar = (t, s, c) => `Pose { translation ${t} children [ Shape { castShadows FALSE appearance PBRAppearance { baseColor ${c} emissiveColor ${c} roughness 1 metalness 0 } geometry Box { size ${s} } } ] }`;
      return `Pose { translation 0 0 ${dz} children [ ${bar(`${L / 2} 0 0`, `${L} ${w} ${w}`, '1 0 0')} ${bar(`0 ${L / 2} 0`, `${w} ${L} ${w}`, '0 0.9 0')} ${bar(`0 0 ${L / 2}`, `${w} ${w} ${L}`, '0 0.3 1')} ] }`;
    }
    const ORANGE = app('0.95 0.55 0.1', 0.4, 0.1);
    const GREY = app('0.85 0.85 0.88', 0.3, 0.2);
  >%
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    controllerArgs IS controllerArgs
    supervisor IS supervisor
    children [
      Emitter { name "emitter" channel IS emitterChannel }
      Receiver { name "receiver" channel IS receiverChannel }
      Pose { translation 0 0 0.02 children [ Shape { appearance %<= app('0.2 0.2 0.22', 0.5, 0.3) >% geometry Cylinder { radius 0.16 height 0.04 } } ] }
      Pose { translation 0 0 0.21 children [ Shape { appearance %<= ORANGE >% geometry Cylinder { radius 0.09 height 0.38 } } ] }
      %<= frame(0.002, 0.22, 0.009) >%
      HingeJoint {
        jointParameters HingeJointParameters { position %<= q[0] >% axis 0 0 1 anchor 0 0 0.4 }
        device [
          RotationalMotor { name "joint1" maxVelocity 3 maxTorque 2000 minPosition -2.6 maxPosition 2.6 }
          PositionSensor { name "joint1_sensor" }
        ]
        endPoint Solid {
          name "link1"
          translation 0 0 0.4
          rotation 0 0 1 %<= q[0] >%
          physics Physics { density -1 mass 2 centerOfMass [ 0.2 0 0.03 ] inertiaMatrix [ 0.004 0.03 0.03, 0 0 0 ] }
          children [
            Pose { translation 0 0 0.03 children [ Shape { appearance %<= ORANGE >% geometry Cylinder { radius 0.09 height 0.06 } } ] }
            Pose { translation 0.2 0 0.03 children [ Shape { appearance %<= ORANGE >% geometry Box { size 0.4 0.12 0.06 } } ] }
            Pose { translation 0.4 0 0.03 children [ Shape { appearance %<= ORANGE >% geometry Cylinder { radius 0.06 height 0.06 } } ] }
            %<= frame(0) >%
            HingeJoint {
              jointParameters HingeJointParameters { position %<= q[1] >% axis 0 0 1 anchor 0.4 0 0.06 }
              device [
                RotationalMotor { name "joint2" maxVelocity 4 maxTorque 2000 minPosition -2.6 maxPosition 2.6 }
                PositionSensor { name "joint2_sensor" }
              ]
              endPoint Solid {
                name "link2"
                translation 0.4 0 0.06
                rotation 0 0 1 %<= q[1] >%
                physics Physics { density -1 mass 1.2 centerOfMass [ 0.15 0 0.025 ] inertiaMatrix [ 0.002 0.01 0.01, 0 0 0 ] }
                children [
                  Pose { translation 0 0 0.025 children [ Shape { appearance %<= GREY >% geometry Cylinder { radius 0.055 height 0.05 } } ] }
                  Pose { translation 0.15 0 0.025 children [ Shape { appearance %<= GREY >% geometry Box { size 0.3 0.1 0.05 } } ] }
                  Pose { translation 0.3 0 0.035 children [ Shape { appearance %<= GREY >% geometry Cylinder { radius 0.05 height 0.07 } } ] }
                  %<= frame(0) >%
                  SliderJoint {
                    jointParameters JointParameters { position %<= q[2] >% axis 0 0 -1 }
                    device [
                      LinearMotor { name "joint3" maxVelocity 0.3 maxForce 2000 minPosition 0 maxPosition 0.15 }
                      PositionSensor { name "joint3_sensor" }
                    ]
                    endPoint Solid {
                      name "quill"
                      translation 0.3 0 %<= -q[2] >%
                      physics Physics { density -1 mass 0.3 centerOfMass [ 0 0 -0.05 ] inertiaMatrix [ 0.003 0.003 0.0001, 0 0 0 ] }
                      children [
                        Pose { translation 0 0 -0.05 children [ Shape { appearance %<= app('0.7 0.72 0.75', 0.15, 0.9) >% geometry Cylinder { radius 0.018 height 0.36 } } ] }
                        %<= frame(0) >%
                        HingeJoint {
                          jointParameters HingeJointParameters { position %<= q[3] >% axis 0 0 1 anchor 0 0 -0.23 }
                          device [
                            RotationalMotor { name "joint4" maxVelocity 5 maxTorque 500 }
                            PositionSensor { name "joint4_sensor" }
                          ]
                          endPoint DEF TOOL Solid {
                            name "gripper"
                            translation 0 0 -0.25
                            rotation 0 0 1 %<= q[3] >%
                            physics Physics { density -1 mass 0.15 centerOfMass [ 0 0 0 ] inertiaMatrix [ 0.0002 0.0002 0.0002, 0 0 0 ] }
                            boundingObject Box { size 0.1 0.04 0.03 }
                            children [
                              Shape { appearance %<= app('0.15 0.15 0.15', 0.5, 0.2) >% geometry Box { size 0.1 0.04 0.03 } }
                              %<= frame(0.02) >%
                              SliderJoint {
                                jointParameters JointParameters { axis 1 0 0 }
                                device [
                                  LinearMotor { name "finger_left" maxVelocity 0.1 maxForce 10 minPosition 0 maxPosition 0.025 }
                                  PositionSensor { name "finger_left_sensor" }
                                ]
                                endPoint DEF FINGER_L Solid {
                                  name "finger left"
                                  translation -0.035 0 -0.035
                                  contactMaterial "finger"
                                  physics Physics { density -1 mass 0.02 centerOfMass [ 0 0 0 ] inertiaMatrix [ 0.00001 0.00001 0.00001, 0 0 0 ] }
                                  children [ Shape { appearance %<= app('0.8 0.1 0.1', 0.5, 0) >% geometry Box { size 0.01 0.03 0.04 } } ]
                                  boundingObject Box { size 0.01 0.03 0.04 }
                                }
                              }
                              SliderJoint {
                                jointParameters JointParameters { axis -1 0 0 }
                                device [
                                  LinearMotor { name "finger_right" maxVelocity 0.1 maxForce 10 minPosition 0 maxPosition 0.025 }
                                  PositionSensor { name "finger_right_sensor" }
                                ]
                                endPoint DEF FINGER_R Solid {
                                  name "finger right"
                                  translation 0.035 0 -0.035
                                  contactMaterial "finger"
                                  physics Physics { density -1 mass 0.02 centerOfMass [ 0 0 0 ] inertiaMatrix [ 0.00001 0.00001 0.00001, 0 0 0 ] }
                                  children [ Shape { appearance %<= app('0.8 0.1 0.1', 0.5, 0) >% geometry Box { size 0.01 0.03 0.04 } } ]
                                  boundingObject Box { size 0.01 0.03 0.04 }
                                }
                              }
                            ]
                          }
                        }
                      ]
                    }
                  }
                ]
              }
            }
          ]
        }
      }
    ]
  }
}
